name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Make your history super green
      - name: Generate multiple past commits
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "${{ github.actor }}@://github.com"
          
          # Creates activity for the past 300 days
          for i in {300..1}
          do
            export GIT_COMMITTER_DATE=$(date -d "$i days ago" +%Y-%m-%dT12:00:00)
            export GIT_AUTHOR_DATE=$(date -d "$i days ago" +%Y-%m-%dT12:00:00)
            
            echo "Activity log for day $i" >> activity.log
            git add activity.log
            git commit --date="$GIT_AUTHOR_DATE" -m "Contribution log sync"
          done
          
          git push origin main

      # Step 2: Run the snake animation over your brand-new green graph
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: Deploy the snake files to your output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
